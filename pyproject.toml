[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sw-maintainer-agent"
version = "0.9.2"
description = "Auditable, provider-neutral software maintenance workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.9,<15"]
keywords = ["ai", "cli", "copilot", "maintenance", "software-engineering"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
browser = ["playwright>=1.52,<2"]
ui = ["PySide6-Essentials>=6.6,<7", "pypdf>=4,<6"]
# Manim's native dependencies (moderngl, glcontext) publish no wheels for
# Python 3.14 yet; without this marker the whole install fails on 3.14
# trying to compile them. With it, the app installs and the render step
# explains how to enable the video feature. PySide6-Addons carries
# Qt Multimedia, so the finished video plays inside the result window.
explain = [
  "manim==0.20.1; python_version < '3.14'",
  "PySide6-Addons>=6.6,<7",
]

[project.scripts]
maintain = "maintain.cli:main"

[project.gui-scripts]
maintain-ui = "maintain.ui.main:main"

[project.urls]
Repository = "https://github.com/tim-a-wood/sw-maintainer-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maintain = ["data/explain/*.md", "data/windows/*.ps1"]

# Static analysis: pyflakes, import and syntax errors, and bugbear on
# everything; the compact one-statement-per-line style in the parser and
# automation modules is accepted as-is.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"src/maintain/artifacts/*" = ["E701", "E702"]
"src/maintain/verification/*" = ["E401", "E701", "E702"]
"src/maintain/workflows/*" = ["E701", "E702"]
"src/maintain/copilot/*" = ["E401", "E701", "E702", "F401", "F841"]
"src/maintain/repository/*" = ["E401", "E701", "E702", "F841"]
"src/maintain/providers/browser.py" = ["B904"]
"src/maintain/providers/base.py" = ["B027"]
"tests/*" = ["E701", "E702"]

# Coverage measures the maintain-ui application. The omitted modules are
# surfaces the desktop app never imports or constructs: the legacy CLI
# front end, the browser-automation providers and their copilot client,
# and retired subpackages with no importers.
[tool.coverage.run]
omit = [
  "*/maintain/cli.py",
  "*/maintain/__main__.py",
  "*/maintain/migration.py",
  "*/maintain/copilot/*",
  "*/maintain/repository/*",
  "*/maintain/providers/browser.py",
  "*/maintain/providers/codex.py",
  "*/maintain/providers/openai.py",
]
