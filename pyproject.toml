[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maintain"
version = "0.1.0"
description = "Local handoff and workflow coordinator for chatbot-assisted software maintenance"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyperclip>=1.8", "rich>=13.9,<15"]
keywords = ["cli", "chatbot", "maintenance", "workflow", "git"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
maintain = "maintain.maintain:main"

[project.urls]
Repository = "https://github.com/tim-a-wood/sw-maintainer-agent"

[tool.setuptools]
packages = ["maintain"]

[tool.setuptools.package-data]
maintain = ["templates/*.md"]
