<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Maintain Simple UI — Interactive Mockup</title>
<style>
  :root{
    --bg0:#d9e2ee; --bg1:#c3d2e3;
    --win:#f8fafc; --win-edge:rgba(20,40,70,.16);
    --bar:#eef3f9; --bar-edge:#e0e8f1;
    --ink:#1b2534; --dim:#5c6c81; --faint:#8ba0b6;
    --acc:#0b6fb8; --acc-ink:#ffffff; --acc-soft:rgba(11,111,184,.10); --acc-edge:rgba(11,111,184,.38);
    --ok:#177245; --ok-soft:rgba(23,114,69,.12);
    --bad:#b23a2f; --bad-soft:rgba(178,58,47,.10);
    --warn:#8a6100; --warn-soft:rgba(196,148,20,.18);
    --chip:#edf2f8; --chip-edge:#d8e2ee;
    --code:#101826; --code-ink:#d5e3f2;
    --drop:#f2f7fc;
    --shadow:0 18px 50px rgba(20,40,70,.26), 0 2px 8px rgba(20,40,70,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg0:#0e1420; --bg1:#131b2a;
      --win:#1b2230; --win-edge:rgba(0,0,0,.55);
      --bar:#212a3c; --bar-edge:#2a3448;
      --ink:#e6edf6; --dim:#9aa9bd; --faint:#6d7d92;
      --acc:#4cbdff; --acc-ink:#06263c; --acc-soft:rgba(76,189,255,.13); --acc-edge:rgba(76,189,255,.42);
      --ok:#3bd694; --ok-soft:rgba(59,214,148,.14);
      --bad:#ff8577; --bad-soft:rgba(255,133,119,.13);
      --warn:#f0c052; --warn-soft:rgba(240,192,82,.15);
      --chip:#242e42; --chip-edge:#313c54;
      --code:#0d1422; --code-ink:#cfdff2;
      --drop:#1f2839;
      --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg0:#d9e2ee; --bg1:#c3d2e3;
    --win:#f8fafc; --win-edge:rgba(20,40,70,.16);
    --bar:#eef3f9; --bar-edge:#e0e8f1;
    --ink:#1b2534; --dim:#5c6c81; --faint:#8ba0b6;
    --acc:#0b6fb8; --acc-ink:#ffffff; --acc-soft:rgba(11,111,184,.10); --acc-edge:rgba(11,111,184,.38);
    --ok:#177245; --ok-soft:rgba(23,114,69,.12);
    --bad:#b23a2f; --bad-soft:rgba(178,58,47,.10);
    --warn:#8a6100; --warn-soft:rgba(196,148,20,.18);
    --chip:#edf2f8; --chip-edge:#d8e2ee;
    --code:#101826; --code-ink:#d5e3f2;
    --drop:#f2f7fc;
    --shadow:0 18px 50px rgba(20,40,70,.26), 0 2px 8px rgba(20,40,70,.10);
  }
  :root[data-theme="dark"]{
    --bg0:#0e1420; --bg1:#131b2a;
    --win:#1b2230; --win-edge:rgba(0,0,0,.55);
    --bar:#212a3c; --bar-edge:#2a3448;
    --ink:#e6edf6; --dim:#9aa9bd; --faint:#6d7d92;
    --acc:#4cbdff; --acc-ink:#06263c; --acc-soft:rgba(76,189,255,.13); --acc-edge:rgba(76,189,255,.42);
    --ok:#3bd694; --ok-soft:rgba(59,214,148,.14);
    --bad:#ff8577; --bad-soft:rgba(255,133,119,.13);
    --warn:#f0c052; --warn-soft:rgba(240,192,82,.15);
    --chip:#242e42; --chip-edge:#313c54;
    --code:#0d1422; --code-ink:#cfdff2;
    --drop:#1f2839;
    --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:14px; color:var(--ink); line-height:1.45;
    background:linear-gradient(165deg,var(--bg0),var(--bg1));
    -webkit-font-smoothing:antialiased;
  }
  code,pre,.mono{font-family:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
  [tabindex]:focus-visible, summary:focus-visible{
    outline:2px solid var(--acc); outline-offset:2px; border-radius:4px;
  }
  input,textarea,select{font:inherit; color:var(--ink)}
  ::placeholder{color:var(--faint)}

  /* ---------- meta bar ---------- */
  .meta{
    max-width:820px; margin:0 auto; padding:14px 22px 4px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .meta-brand{font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); white-space:nowrap}
  .meta-hint{font-size:12.5px; color:var(--dim); flex:1; min-width:180px}
  .meta button, .navsel{
    font-size:12px; font-weight:600; color:var(--dim);
    border:1px solid var(--win-edge); border-radius:6px; padding:5px 12px; background:var(--win);
  }
  .meta button:hover{color:var(--ink); border-color:var(--acc-edge)}
  .navsel{max-width:190px}

  /* ---------- scene ---------- */
  .scene{max-width:820px; margin:0 auto; padding:12px 22px 36px; display:flex; justify-content:center}
  .win{
    width:600px; max-width:100%;
    background:var(--win); border:1px solid var(--win-edge); border-radius:10px;
    box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
    min-height:680px;
  }
  .tbar{
    height:42px; flex:none; background:var(--bar); border-bottom:1px solid var(--bar-edge);
    display:flex; align-items:center; padding:0 6px 0 14px; gap:10px;
    -webkit-user-select:none; user-select:none;
  }
  .tbar-app{display:flex; align-items:center; gap:9px; font-size:12.5px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden}
  .appdot{width:20px; height:20px; border-radius:5px; background:var(--acc); color:var(--acc-ink);
    display:inline-flex; align-items:center; justify-content:center; font-size:11px; flex:none}
  .tbar-btns{display:flex; color:var(--faint); font-size:10px}
  .tbar-btns span{width:34px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:5px}
  .tbar-btns span:hover{background:var(--chip)}

  /* ---------- stage header ---------- */
  .stagewrap{flex:none; padding:14px 22px 0}
  .stages{display:flex; align-items:flex-start}
  .stage{display:flex; flex-direction:column; align-items:center; gap:5px; width:52px; flex:none}
  .stage-dot{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--faint); color:var(--dim);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:600;
    background:var(--win); position:relative; z-index:1;
  }
  .stage-lbl{font-size:10.5px; color:var(--dim); letter-spacing:.02em}
  .stage.cur .stage-dot{border-color:var(--acc); color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft)}
  .stage.cur .stage-lbl{color:var(--acc); font-weight:600}
  .stage.done .stage-dot{border-color:var(--ok); background:var(--ok); color:#fff}
  .stage-link{flex:1; height:2px; background:var(--chip-edge); margin-top:12px; min-width:10px}
  .stage-link.done{background:var(--ok)}

  .m-body{flex:1; overflow-y:auto; padding:20px 24px 22px; display:flex; flex-direction:column; gap:14px}
  .m-foot{
    flex:none; border-top:1px solid var(--bar-edge); background:var(--bar);
    min-height:38px; display:flex; align-items:center; gap:6px; padding:0 14px;
    font-size:11.5px; color:var(--dim);
  }
  .m-foot .spacer{flex:1}
  .foot-btn{font-size:12px; font-weight:600; color:var(--dim); padding:4px 10px; border-radius:5px}
  .foot-btn:hover{color:var(--acc); background:var(--acc-soft)}
  .foot-btn.stop:hover{color:var(--bad); background:var(--bad-soft)}

  .step-eyebrow{font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--acc)}
  h1.m-title{font-size:19px; font-weight:600; letter-spacing:-.01em; text-wrap:balance}
  .m-lead{font-size:13.5px; color:var(--dim); max-width:44ch}
  .m-gap{height:2px}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:6px; font-size:13.5px; font-weight:600; padding:9px 16px;
    border:1px solid transparent; transition:filter .12s ease, background .12s ease;
  }
  .btn.primary{background:var(--acc); color:var(--acc-ink)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.primary:disabled{opacity:.45; cursor:not-allowed; filter:none}
  .btn.secondary{border-color:var(--win-edge); color:var(--ink); background:var(--win)}
  .btn.secondary:hover{border-color:var(--acc-edge); background:var(--acc-soft)}
  .btn.ghost{color:var(--dim); font-weight:600}
  .btn.ghost:hover{color:var(--acc)}
  .btn.danger-ghost{color:var(--dim)}
  .btn.danger-ghost:hover{color:var(--bad); background:var(--bad-soft)}
  .btn.sm{padding:6px 12px; font-size:12.5px}
  .btn.block{width:100%}
  .btn-caption{font-size:11.5px; color:var(--dim); margin-top:5px}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .btncol{display:flex; flex-direction:column; gap:10px}

  .bigchoice{
    display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    border:1px solid var(--win-edge); border-radius:9px; padding:14px 16px; background:var(--win);
  }
  .bigchoice:hover{border-color:var(--acc-edge); background:var(--acc-soft)}
  .bigchoice .ico{
    width:38px; height:38px; flex:none; border-radius:8px; background:var(--acc-soft); color:var(--acc);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .bigchoice b{display:block; font-size:14px}
  .bigchoice span.sub{display:block; font-size:12px; color:var(--dim); margin-top:1px}
  .bigchoice.resume .ico{background:var(--warn-soft); color:var(--warn)}

  .homehead{display:flex; flex-direction:column; gap:2px; margin-bottom:4px}
  .homehead .proj{font-size:17px; font-weight:600}
  .homehead .path{font-size:11.5px; color:var(--faint)}

  textarea.req{
    width:100%; min-height:92px; resize:vertical; border:1px solid var(--win-edge); border-radius:8px;
    padding:11px 13px; font-size:13.5px; background:var(--win); line-height:1.5;
  }
  .example-link{font-size:12px; color:var(--acc); font-weight:600; align-self:flex-start}
  .example-link:hover{text-decoration:underline}

  .dropzone{
    border:1.6px dashed var(--acc-edge); border-radius:10px; background:var(--drop);
    padding:22px 18px; text-align:center; color:var(--dim); font-size:13px;
    transition:background .12s ease, border-color .12s ease;
  }
  .dropzone .dz-main{font-weight:600; color:var(--ink); font-size:13.5px}
  .dropzone .dz-sub{font-size:12px; margin-top:3px}
  .dropzone.over{background:var(--acc-soft); border-color:var(--acc)}
  .dropzone.big{padding:34px 18px}
  .dropzone.slim{padding:10px 14px; font-size:12px}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    display:inline-flex; align-items:center; gap:8px; max-width:100%;
    background:var(--chip); border:1px solid var(--chip-edge); border-radius:7px;
    padding:6px 10px; font-size:12px;
  }
  .chip .cname{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip .csize{color:var(--faint); font-size:11px; white-space:nowrap}
  .chip .cx{color:var(--faint); font-size:11px; padding:2px 4px; border-radius:4px}
  .chip .cx:hover{color:var(--bad); background:var(--bad-soft)}
  .zicon{width:15px; height:15px; flex:none; color:var(--acc)}

  .pkgcard{
    display:flex; align-items:center; gap:14px; border:1px solid var(--acc-edge); border-radius:10px;
    padding:14px 16px; background:linear-gradient(180deg,var(--acc-soft),transparent);
    cursor:grab; -webkit-user-select:none; user-select:none; position:relative;
  }
  .pkgcard:active{cursor:grabbing}
  .pkgcard .pk-ico{width:40px; height:40px; flex:none; color:var(--acc)}
  .pkgcard .pk-name{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace; font-size:12.5px; font-weight:600; word-break:break-all}
  .pkgcard .pk-sub{font-size:11.5px; color:var(--dim); margin-top:2px}
  .pkgcard .pk-grip{margin-left:auto; color:var(--faint); font-size:15px; letter-spacing:2px; flex:none}
  .pkgcard.dragging{opacity:.55}

  .subhead{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
  .ordiv{display:flex; align-items:center; gap:10px; color:var(--faint); font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600}
  .ordiv::before,.ordiv::after{content:""; flex:1; height:1px; background:var(--chip-edge)}

  .statusline{display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--dim); min-height:20px}
  .statusline.ok{color:var(--ok); font-weight:600}
  .statusline.bad{color:var(--bad); font-weight:600}
  .statusbox{display:flex; flex-direction:column; gap:7px; border-radius:8px; padding:2px 0}
  .spin{
    width:13px; height:13px; flex:none; margin-top:3px; border-radius:50%;
    border:2px solid var(--chip-edge); border-top-color:var(--acc); animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .tick{color:var(--ok); font-weight:700; flex:none}
  .cross{color:var(--bad); font-weight:700; flex:none}

  details.pkg-details{border:1px solid var(--win-edge); border-radius:8px; padding:0}
  details.pkg-details summary{
    list-style:none; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--dim); padding:9px 13px;
  }
  details.pkg-details summary::before{content:"▸ "; color:var(--faint)}
  details.pkg-details[open] summary::before{content:"▾ "}
  .pkg-list{border-top:1px solid var(--bar-edge); padding:8px 13px 11px; display:flex; flex-direction:column; gap:6px}
  .pkg-row{display:flex; align-items:baseline; gap:8px; font-size:12px}
  .pkg-row code{font-size:11.5px}
  .pkg-row .why{color:var(--faint); font-size:11.5px; flex:1}
  .pkg-row .show{color:var(--acc); font-weight:600; font-size:11.5px}
  .pkg-row .show:hover{text-decoration:underline}

  .taskcard{border:1px solid var(--win-edge); border-radius:9px; padding:12px 14px; display:flex; gap:12px}
  .taskcard .tno{
    width:22px; height:22px; flex:none; border-radius:50%; background:var(--acc-soft); color:var(--acc);
    font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .taskcard b{font-size:13.5px; font-weight:600}
  .taskcard .tfiles{font-size:11.5px; color:var(--dim); margin-top:3px}
  .taskcard .tfiles code{font-size:11px}
  .taskcard details{margin-top:5px}
  .taskcard summary{font-size:11.5px; color:var(--acc); cursor:pointer; list-style:none; font-weight:600}
  .taskcard details div{font-size:12px; color:var(--dim); margin-top:4px}

  .finding{border:1px solid var(--win-edge); border-left:3px solid var(--warn); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
  .sevrow{display:flex; align-items:center; gap:8px}
  .sev{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border-radius:99px; padding:2px 9px}
  .sev.minor{background:var(--warn-soft); color:var(--warn)}
  .finding .floc{font-size:11.5px}
  .finding p{font-size:12.5px}
  .finding p b{font-weight:600}

  .checkrow{display:flex; align-items:center; gap:10px; border:1px solid var(--win-edge); border-radius:8px; padding:10px 13px}
  .checkrow .cmeta{flex:1; min-width:0}
  .checkrow b{font-size:13px}
  .checkrow .ccmd{font-size:11px; color:var(--faint)}
  .badge{font-size:10.5px; font-weight:700; letter-spacing:.07em; border-radius:5px; padding:2.5px 8px; flex:none}
  .badge.pass{background:var(--ok-soft); color:var(--ok)}
  .badge.fail{background:var(--bad-soft); color:var(--bad)}
  .badge.wait{background:var(--chip); color:var(--faint)}
  .checkout{display:none; font-size:11px; background:var(--code); color:var(--code-ink); border-radius:6px; padding:8px 10px; margin-top:8px; white-space:pre-wrap}
  .checkrow.open .checkout{display:block}
  .checkwrap{display:flex; flex-direction:column}
  .checkrow .cshow{font-size:11px; color:var(--dim); flex:none}
  .checkrow .cshow:hover{color:var(--acc)}

  .filerow{display:flex; align-items:baseline; gap:10px; font-size:12.5px}
  .filerow code{font-size:11.5px}
  .filerow .plus{color:var(--ok); font-weight:600; font-size:11.5px}
  .filerow .minus{color:var(--bad); font-weight:600; font-size:11.5px}
  pre.diff{
    background:var(--code); color:var(--code-ink); font-size:11px; line-height:1.55;
    border-radius:8px; padding:12px 14px; overflow-x:auto;
  }
  pre.diff .da{color:#7ce0a3} pre.diff .dr{color:#ff9b8f} pre.diff .dh{color:#8fb8e8}

  .donewrap{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding-top:26px}
  .donetick{
    width:54px; height:54px; border-radius:50%; background:var(--ok-soft); color:var(--ok);
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700;
  }

  /* ---------- history ---------- */
  .runrow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1px solid var(--win-edge); border-radius:9px; padding:12px 14px; background:var(--win);
  }
  .runrow:hover{border-color:var(--acc-edge); background:var(--acc-soft)}
  .runrow .rmeta{flex:1; min-width:0}
  .runrow b{font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .runrow .rsub{font-size:11.5px; color:var(--dim); margin-top:1px}
  .statechip{font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; border-radius:99px; padding:2.5px 9px; flex:none}
  .statechip.saved{background:var(--ok-soft); color:var(--ok)}
  .statechip.inwork{background:var(--acc-soft); color:var(--acc)}
  .statechip.discarded{background:var(--chip); color:var(--faint)}
  .statechip.stopped{background:var(--warn-soft); color:var(--warn)}

  .timeline{display:flex; flex-direction:column}
  .it{display:flex; gap:12px; position:relative; padding:0 0 16px 0}
  .it::before{
    content:""; position:absolute; left:11px; top:24px; bottom:0; width:2px; background:var(--chip-edge);
  }
  .it:last-child::before{display:none}
  .it-dot{
    width:24px; height:24px; flex:none; border-radius:50%; border:2px solid var(--chip-edge);
    background:var(--win); color:var(--dim); font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; position:relative; z-index:1;
  }
  .it.cur .it-dot{border-color:var(--acc); color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft)}
  .it.rev .it-dot{border-color:var(--warn); color:var(--warn)}
  .it-main{flex:1; min-width:0; padding-top:2px}
  .it b{font-size:13px; font-weight:600}
  .it .it-sub{font-size:11.5px; color:var(--dim); margin-top:1px; overflow-wrap:anywhere}
  .it .it-time{font-size:11px; color:var(--faint); padding-top:4px; flex:none}
  .it-act{font-size:11.5px; font-weight:600; color:var(--acc); flex:none; padding-top:3px}
  .it-act:hover{text-decoration:underline}
  .it.super .it-main, .it.super .it-time{opacity:.5}
  .it .tagsuper{
    font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--faint); border:1px solid var(--chip-edge); border-radius:99px; padding:1px 7px; margin-left:7px;
  }

  /* ---------- settings ---------- */
  .setrow{display:flex; flex-direction:column; gap:5px}
  .setrow label{font-size:12px; font-weight:600; color:var(--dim)}
  .setrow input[type=text],.setrow input[type=number]{
    border:1px solid var(--win-edge); border-radius:7px; padding:8px 11px; font-size:13px; background:var(--win); width:100%;
  }
  .setrow .hint{font-size:11.5px; color:var(--faint)}
  .setrow .hint code{font-size:10.5px; word-break:break-all}
  .radio{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--win-edge); border-radius:8px; padding:11px 13px; cursor:pointer}
  .radio input{margin-top:3px; accent-color:var(--acc)}
  .radio b{font-size:13px}
  .radio span{display:block; font-size:12px; color:var(--dim)}
  textarea.gp{
    width:100%; min-height:200px; resize:vertical; border:1px solid var(--win-edge); border-radius:8px;
    padding:11px 13px; font-size:12px; background:var(--win);

<script>
(function(){
"use strict";
function main(){
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){

const ZIP_ICON = '<svg class="zicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M12 10v1m0 2v1m0 2v1" stroke-linecap="round"/></svg>';
const PKG_ICON = '<svg class="pk-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M11.5 9v1.2m0 1.8v1.2m0 1.8V16.2" stroke-linecap="round"/><path d="M15 12.5h3M15 15h3" stroke-linecap="round" opacity=".55"/></svg>';

/* ================= fixed content ================= */
const EXAMPLE = "Add an input filter for wind data in the loader. Reject speeds below 0 kt and above 150 kt.";
const GP_DEFAULT = [

   done:"Tests cover the limits, the unit conversion, and one pass case.", verify:"pytest -q"},

];

const DIFF_SNIPPET =
'<span class="dh">--- a/src/loader/filter.py\n+++ b/src/loader/filter.py\n@@ -39,6 +39,13 @@ def load_wind(records):</span>\n' +

'<span class="da">+    filtered = []\n+    for r in records:\n+        if not r.valid:\n+            continue\n+        speed_kt = to_knots(r.speed, r.unit)\n+        if 0 &lt;= speed_kt &lt;= 150:\n+            filtered.append(r)\n+    return filtered</span>';
function pastIters(rows){
  return rows.map((r, i) => ({n:i+1, t:r[0], label:r[1], sub:r[2]||"", snap:null, super:!!r[3], rev:r[1].indexOf("Went back")===0}));

const PAST_RUNS = [

   iters:pastIters([["09:12","Run started","Correct the fuel unit rounding fault"],["09:19","Plan proposed — 2 tasks"],

     ["09:58","All checks passed"],["10:02","Saved","branch maintain/0142-fuel-rounding"]])},
  {id:"0141", title:"Add the route export to PDF", state:"Saved", date:"25 Jul 2026", files:4,
   iters:pastIters([["14:02","Run started","Add the route export to PDF"],["14:11","Plan proposed — 3 tasks"],
     ["14:15","Plan approved"],["14:40","Build applied — 4 files"],["14:52","Review found 2 points","",true],
     ["15:04","Repair applied","",true],["15:06","Went back to iteration 3"],["15:31","Build applied — 4 files"],
     ["15:44","Review approved"],["15:47","All checks passed"],["15:52","Saved","branch maintain/0141-route-pdf"]])},
  {id:"0140", title:"Test OneDrive folder change", state:"Discarded", date:"24 Jul 2026", files:0,
   iters:pastIters([["11:30","Run started","Test OneDrive folder change"],["11:36","Plan proposed — 1 task"],["11:38","Discarded"]])}

/* ================= state ================= */
let S;
function baseSettings(){

    folder: "C:\\Users\\tim\\OneDrive\\MaintainOutbox",

    timeout: 120,

    checks: [

function initState(keepSettings){
  const settings = keepSettings && S ? S.settings : baseSettings();
  S = {
    screen:"home", stage:-1,

/* ================= exchange model ================= */
const ROLE_META = {
  scope:     {stage:0, key:"plan",   step:"Step 1 of 5 — Plan",   lead:"Copilot makes the plan.",      slug:"plan"},
  implement: {stage:1, key:"build",  step:"Step 2 of 5 — Build",  lead:"Copilot writes the code.",     slug:"build"},
  repair:    {stage:1, key:"repair", step:"Step 2 of 5 — Build",  lead:"Copilot repairs the code.",    slug:"repair"},
  review:    {stage:2, key:"review", step:"Step 3 of 5 — Review", lead:"Copilot examines the change.", slug:"review"}
};
function newExchange(role){
  S.exSeq += 1;
  let n = 1;
  if (role === "scope"){ S.planAttempt += 1; n = S.planAttempt; }
  if (role === "review"){ S.reviewRound += 1; n = S.reviewRound; }
  S.ex = {
    id:S.exSeq, role, round:n,
    pkgName:"maintain-0143-" + ROLE_META[role].slug + (n > 1 ? "-" + n : "") + ".zip",
    outAction:false, sync:"idle",

}
function pkgSize(){
  const base = {scope:182, implement:191, repair:188, review:204}[S.ex.role];
  return (base + 9 * S.ex.attachments.length) + " KB";
}
function docsForRole(role){
  return S.settings.projectDocs.concat(S.settings.tasks[ROLE_META[role].key].docs);
}
function oneDriveLink(){
  return S.settings.linkBase.replace(/\/+$/, "") + "/" + encodeURIComponent(S.ex.pkgName);
}
function filesChanged(){
  const base = [
    {path:"src/loader/filter.py", plus:38, minus:2},
    {path:"tests/test_filter.py", plus:54, minus:0},
    {path:"docs/manual.md", plus:9, minus:1}
  ];
  return S.planTasks.length === 2 ? base.slice(0,2) : base;
}

/* ================= iterations ================= */
function timeLabel(){ const m = S.iterations.length * 4; return "12:" + String(m % 60).padStart(2, "0"); }
function pushIter(label, sub, snap, rev){
  S.iterations.push({n:S.iterations.length + 1, t:timeLabel(), label, sub:sub || "", snap:snap || null, super:false, rev:!!rev});
}
function snapNow(extra){
  return Object.assign({stage:S.stage, planTasks:S.planTasks.slice()}, extra);
}
function evStart(){
  S.runActive = true;
  if (!S.request) S.request = EXAMPLE;

  S.screen = "send";
}
function evPlanProposed(){
  S.planTasks = (S.ex.round > 1 ? TASKS_V2 : TASKS_V1).slice();
  pushIter(S.ex.round > 1 ? "Plan changed — " + S.planTasks.length + " tasks"
                          : "Plan proposed — " + S.planTasks.length + " tasks",
           "", snapNow({screen:"plancheck", stage:0}));
  S.stage = 0; S.screen = "plancheck";
}
function evPlanApproved(){
  pushIter("Plan approved", S.planTasks.length + " tasks", snapNow({screen:"send", stage:1, role:"implement"}));
  newExchange("implement"); S.screen = "send";
}
function evBuildApplied(){
  pushIter("Build applied — " + filesChanged().length + " files", "isolated workspace",
           snapNow({screen:"send", stage:2, role:"review"}));
  newExchange("review"); S.screen = "send";
}
function evReviewFound(){
  pushIter("Review found 1 point", FINDING.severity + " · " + FINDING.file + ":" + FINDING.line,
           snapNow({screen:"review-findings", stage:2}));
  S.stage = 2; S.screen = "review-findings";
}
function evRepairApplied(){
  pushIter("Repair applied", "isolated workspace", snapNow({screen:"send", stage:2, role:"review"}));
  newExchange("review"); S.screen = "send";
}
function evReviewApproved(instant){
  pushIter("Review approved", "", snapNow({screen:"test", stage:3, checks:true}));
  startTests(instant);
}
function evChecksPassed(){
  const last = S.iterations[S.iterations.length - 1];
  if (last && last.label === "All checks passed") return;
  pushIter("All checks passed", S.checksState.map(c => c.name).join(" · "), snapNow({screen:"save", stage:4}));
}
function closeRun(state, sub){
  pushIter(state, sub || "", null);
  S.runs.unshift({id:"0143", title:S.request, state, date:"28 Jul 2026",
                  files:state === "Saved" ? filesChanged().length : 0, iters:S.iterations.slice()});
  S.runActive = false; S.paused = null;
}

/* ================= rendering ================= */
const STAGES = ["Plan","Build","Review","Test","Save"];
const NO_STAGE = ["home","describe","settings","set-onedrive","set-tasks","set-global","set-package","set-checks","done","history","run-detail"];

    if (i < 4) h += '<div class="stage-link ' + (i < S.stage ? "done" : "") + '"></div>';

function setRecvStatus(html){ const n = $("#recvStatus"); if (n) n.innerHTML = html; }
function acceptSimReply(){
  if (S.screen !== "receive" || !S.ex) return;
  const role = S.ex.role;
  setRecvStatus('<div class="statusline"><span class="spin"></span>Check the reply…</div>');
  setTimeout(() => {
    let h = '<div class="statusline ok"><span class="tick">&#10003;</span>The reply matches run 0143.</div>';
    if (role === "implement" || role === "repair"){
      h += '<div class="statusline"><span class="spin"></span>Apply the files in the isolated workspace…</div>';
      setRecvStatus(h);
      setTimeout(() => {
        setRecvStatus('<div class="statusline ok"><span class="tick">&#10003;</span>The reply matches run 0143.</div>' +
          '<div class="statusline ok"><span class="tick">&#10003;</span>Applied. Your project does not change before you accept.</div>');
        setTimeout(() => { role === "repair" ? evRepairApplied() : evBuildApplied(); render(); }, 900);
      }, 1000);
      return;
    }
    setRecvStatus(h);
    setTimeout(() => {
      if (role === "scope"){ evPlanProposed(); render(); }
      else if (role === "review"){
        if (S.reviewRound === 1){ evReviewFound(); render(); }
        else {
          setRecvStatus('<div class="statusline ok"><span class="tick">&#10003;</span>Copilot approves the change.</div>');
          setTimeout(() => { evReviewApproved(false); }, 800);
        }
      }
    }, 700);
  }, 750);
}

/* ================= tests ================= */
function startTests(instant){
  S.stage = 3; S.screen = "test"; S.checksLogged = false;
  S.checksState = S.settings.checks.map(c => ({name:c.name, cmd:c.cmd, out:c.out || "(no output)", state:instant ? "pass" : "wait"}));
  if (instant){ evChecksPassed(); render(); return; }
  render();
  runNextCheck(0);
}
function runNextCheck(i){
  if (i >= S.checksState.length){ evChecksPassed(); render(); return; }
  S.checksState[i].state = "run"; render();
  setTimeout(() => { S.checksState[i].state = "pass"; render(); runNextCheck(i + 1); }, 620);
}

function copyLinkFlow(){
  const ex = S.ex;
  if (ex.sync === "copying" || ex.sync === "syncing") return;
  if (ex.sync === "done"){ sysCopy(oneDriveLink()); toast("The link is in the clipboard."); return; }
  ex.sync = "copying"; render();
  setTimeout(() => { if (S.ex !== ex) return; ex.sync = "syncing"; render();
    setTimeout(() => { if (S.ex !== ex) return;
      ex.sync = "done"; ex.outAction = true; sysCopy(oneDriveLink()); render();
    }, 1500);
  }, 800);
}

/* ================= drag & drop ================= */
function bindPkgDrag(){
  const card = $("#pkgCard");
  if (!card) return;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", S.ex.pkgName);
    e.dataTransfer.effectAllowed = "copy";
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
}
function fileList(files){
  const out = [];
  for (const f of files) out.push({name:f.name, size:f.size ? Math.max(1, Math.round(f.size / 1024)) + " KB" : ""});
  return out;
}
const FAKE_FILES = ["wind-spec-extract.pdf","notam-sample.txt","icao-limits.xlsx","loader-notes.md"];
let fakeIdx = 0;
function nextFakeFile(){ const n = FAKE_FILES[fakeIdx % FAKE_FILES.length]; fakeIdx += 1; return {name:n, size:(140 + 60 * (fakeIdx % 4)) + " KB"}; }
const FAKE_DOCS = ["docs/standards/naming.md","docs/wind-limits.md","docs/interfaces/loader-api.md"];
let fakeDocIdx = 0;
function nextFakeDoc(){ const n = FAKE_DOCS[fakeDocIdx % FAKE_DOCS.length]; fakeDocIdx += 1; return n; }

(function(){
  const body = $("#mBody");
  body.addEventListener("dragover", e => {
    const z = e.target.closest(".dropzone");
    if (z){ e.preventDefault(); z.classList.add("over"); }
  });
  body.addEventListener("dragleave", e => {
    const z = e.target.closest(".dropzone"); if (z) z.classList.remove("over");
  });
  body.addEventListener("drop", e => {
    const z = e.target.closest(".dropzone"); if (!z) return;
    e.preventDefault(); z.classList.remove("over");
    const kind = z.getAttribute("data-drop");
    const files = e.dataTransfer.files && e.dataTransfer.files.length ? fileList(e.dataTransfer.files) : [];
    if (kind === "refs"){
      if (files.length){ saveRequestDraft(); S.runRefs.push(...files); render();
        toast("Added " + files.length + " file" + (files.length > 1 ? "s" : "") + " to the run."); }
      return;
    }
    if (kind === "attach"){
      if (files.length){ S.ex.attachments.push(...files); render(); toast("The package is updated."); }
      return;
    }
    if (kind === "reply"){ acceptSimReply(); }
  });
})();

function noteModal(title, sub, act){
  openModal('<h2>' + esc(title) + '</h2><p>' + esc(sub) + '</p>' +
    '<textarea id="noteText" placeholder="Write the change in one or two sentences."></textarea>' +
    '<div class="btnrow"><button class="btn primary sm" data-act="' + act + '" type="button">Send the note</button>' +
    '<button class="btn ghost sm" data-act="modal-close" type="button">Go back</button></div>');
}

/* ================= actions ================= */
function saveRequestDraft(){ const t = $("#reqText"); if (t) S.request = t.value; }
function collectTaskEdits(){
  const p = $("#tPrompt");
  if (p && S.setTab !== "project") S.settings.tasks[S.setTab].prompt = p.value;
}
function collectCheckEdits(){
  document.querySelectorAll(".checkedit input").forEach(inp => {
    const i = Number(inp.getAttribute("data-i")), k = inp.getAttribute("data-k");
    if (S.settings.checks[i]) S.settings.checks[i][k] = inp.value;
  });
}
function restoreIter(i){
  const it = S.iterations[i]; if (!it || !it.snap) return;
  for (let j = i + 1; j < S.iterations.length; j++) S.iterations[j].super = true;
  const snap = it.snap;
  S.planTasks = snap.planTasks.slice();
  S.stage = snap.stage;
  pushIter("Went back to iteration " + it.n, "", null, true);
  if (snap.role){ newExchange(snap.role); S.screen = "send"; }
  else if (snap.checks){ startTests(true); }
  else { S.screen = snap.screen; }
  toast("Went back to iteration " + it.n + ".");
  render();
}

function handleAction(act, node){
  switch(act){
    /* navigation */
    case "go-home": S.screen = "home"; render(); break;
    case "settings": collectTaskEdits(); S.screen = "settings"; render(); break;
    case "set-onedrive": case "set-global": case "set-package": case "set-checks":
      S.screen = act; render(); break;
    case "set-tasks": S.setTab = "project"; S.screen = "set-tasks"; render(); break;

    /* home */
    case "new-feature": case "new-issue": S.screen = "describe"; render(); break;
    case "resume":
      S.screen = S.paused.screen; S.stage = S.paused.stage; S.paused = null; render(); break;

    /* describe */
    case "example": saveRequestDraft(); S.request = EXAMPLE; render(); break;
    case "import-refs":
      saveRequestDraft(); S.runRefs.push(nextFakeFile()); render(); toast("Added 1 file to the run."); break;
    case "ref-x":
      saveRequestDraft(); S.runRefs.splice(Number(node.getAttribute("data-i")), 1); render(); break;
    case "start-run":
      saveRequestDraft();
      if (!S.request.trim()){ toast("First write the change."); break; }
      evStart(); render(); break;

    /* send */
    case "copy-link": copyLinkFlow(); break;
    case "copy-file":
      S.ex.outAction = true; toast("The package is in the clipboard. Paste it into Copilot."); render(); break;
    case "export":
      S.ex.outAction = true; toast("Saved " + S.ex.pkgName + " to Downloads."); render(); break;
    case "att-add":
      S.ex.attachments.push(nextFakeFile()); render(); toast("The package is updated."); break;
    case "att-x":
      S.ex.attachments.splice(Number(node.getAttribute("data-i")), 1); render(); toast("The package is updated."); break;
    case "show-global":
      openModal('<h2>GLOBAL.md</h2><p>The tool puts this file into every package. Change it in Settings.</p>' +
        '<pre class="gpview">' + esc(S.settings.global) + '</pre>' +
        '<div class="btnrow"><button class="btn ghost sm" data-act="modal-close" type="button">Close</button></div>');
      break;
    case "show-prompt": {
      const key = ROLE_META[S.ex.role].key;
      const t = S.settings.tasks[key];
      openModal('<h2>Boilerplate prompt — ' + esc(key) + '</h2>' +
        '<p>' + (t.override ? "This task uses its own prompt. Change it in Settings." : "This task uses the built-in prompt. Change it in Settings.") + '</p>' +
        '<pre class="gpview">' + esc(t.override ? t.prompt : BUILTIN[key]) + '</pre>' +
        '<div class="btnrow"><button class="btn ghost sm" data-act="modal-close" type="button">Close</button></div>');
      break;
    }
    case "to-receive": S.screen = "receive"; render(); break;
    case "back-send": S.screen = "send"; render(); break;

    /* receive */
    case "paste-reply": acceptSimReply(); break;
    case "import-reply":
      openModal('<h2>Import a file</h2><div class="dlpick">' +
        '<span class="chip" data-act="import-pick" tabindex="0" role="button">' + ZIP_ICON +
        '<span class="cname">maintain-output.zip</span><span class="csize">Downloads</span></span></div>' +
        '<div class="btnrow"><button class="btn ghost sm" data-act="modal-close" type="button">Close</button></div>');
      break;
    case "import-pick": closeModal(); acceptSimReply(); break;

    /* plan check */
    case "accept-plan": evPlanApproved(); render(); break;
    case "rescope":
      noteModal("Ask for changes", "Tell Copilot what to change in the plan.", "rescope-send"); break;
    case "rescope-send":
      closeModal(); newExchange("scope"); S.screen = "send"; render();
      toast("The note is in the new plan package."); break;
    case "rescope-late":
      noteModal("Scope again", "The tool starts a new plan with your note. The current work stays in the history.", "rescope-send");
      break;

    /* review findings */
    case "start-repair": newExchange("repair"); S.screen = "send"; render(); break;

    /* test */
    case "run-checks": startTests(false); break;
    case "chk-out": node.closest(".checkrow").classList.toggle("open"); break;
    case "to-save": S.stage = 4; S.screen = "save"; render(); break;

    /* save */
    case "accept-save": closeRun("Saved", "branch maintain/0143-wind-filter"); S.screen = "done"; render(); break;
    case "feedback":
      noteModal("Ask for changes", "Tell Copilot what to change. The tool makes a repair package.", "feedback-send"); break;
    case "feedback-send":
      closeModal(); newExchange("repair"); S.screen = "send"; render(); break;
    case "discard":
      openModal('<h2>Discard the change?</h2><p>The tool removes the work of run 0143. Your project does not change. The history keeps the record.</p>' +
        '<div class="btnrow"><button class="btn primary sm" data-act="discard-yes" type="button">Discard</button>' +
        '<button class="btn ghost sm" data-act="modal-close" type="button">Go back</button></div>');
      break;
    case "discard-yes":
      closeModal(); closeRun("Discarded"); S.screen = "home"; render(); toast("The change is discarded."); break;

    /* done */
    case "new-run": {
      const runs = S.runs, req = "";
      initState(true); S.runs = runs; S.screen = "describe"; render(); break;
    }

    /* history */
    case "history": S.historyBack = "home"; S.screen = "history"; render(); break;
    case "history-live": S.viewRun = "live"; S.historyBack = S.screen; S.screen = "run-detail"; render(); break;
    case "open-run":
      S.viewRun = node.getAttribute("data-id"); S.historyBack = "history"; S.screen = "run-detail"; render(); break;
    case "history-back":
      S.screen = S.historyBack === "run-detail" ? "history" : S.historyBack; render(); break;
    case "go-back": {
      const i = Number(node.getAttribute("data-i"));
      const it = S.iterations[i]; S.pendingRevert = i;
      openModal('<h2>Go back to iteration ' + it.n + '?</h2>' +
        '<p>The tool returns the work to the state after: ' + esc(it.label) + '. The later iterations stay in the history as superseded. The tool does not delete work.</p>' +
        '<div class="btnrow"><button class="btn primary sm" data-act="go-back-yes" type="button">Go back</button>' +
        '<button class="btn ghost sm" data-act="modal-close" type="button">Stay here</button></div>');
      break;
    }
    case "go-back-yes":
      closeModal(); restoreIter(S.pendingRevert); break;
    case "undo-last": {
      const snaps = S.iterations.map((it, i) => it.snap ? i : -1).filter(i => i >= 0);
      if (snaps.length >= 2) handleAction("go-back", {getAttribute:() => String(snaps[snaps.length - 2])});
      break;
    }

    /* stop / pause */
    case "stop":
      openModal('<h2>Stop the run?</h2><p>The run keeps its state. You can continue from the home screen.</p>' +
        '<div class="btnrow"><button class="btn primary sm" data-act="stop-yes" type="button">Stop</button>' +
        '<button class="btn ghost sm" data-act="modal-close" type="button">Go back</button></div>');
      break;
    case "stop-yes": {
      closeModal();
      const lbl = STAGES[Math.max(S.stage, 0)] + ". The tool waits for you.";
      S.paused = {screen:S.screen === "run-detail" ? "home" : S.screen, stage:S.stage, label:lbl};
      S.screen = "home"; render(); break;
    }

    /* settings */
    case "browse": toast("The folder picker opens here in the real tool."); break;
    case "save-onedrive":
      S.settings.folder = $("#sFolder").value;
      S.settings.linkBase = $("#sLink").value;
      S.settings.timeout = Number($("#sTimeout").value) || 120;
      toast("Saved."); S.screen = "settings"; render(); break;
    case "set-tab":
      collectTaskEdits(); S.setTab = node.getAttribute("data-tab"); render(); break;
    case "prompt-override":
      S.settings.tasks[S.setTab].override = true; render(); break;
    case "prompt-builtin":
      S.settings.tasks[S.setTab].override = false;
      S.settings.tasks[S.setTab].prompt = BUILTIN[S.setTab]; render(); break;
    case "pdoc-add": S.settings.projectDocs.push(nextFakeDoc()); render(); break;
    case "pdoc-x": S.settings.projectDocs.splice(Number(node.getAttribute("data-i")), 1); render(); break;
    case "tdoc-add": collectTaskEdits(); S.settings.tasks[S.setTab].docs.push(nextFakeDoc()); render(); break;
    case "tdoc-x": collectTaskEdits(); S.settings.tasks[S.setTab].docs.splice(Number(node.getAttribute("data-i")), 1); render(); break;
    case "save-tasks": collectTaskEdits(); toast("Saved."); S.screen = "settings"; render(); break;
    case "save-global":
      S.settings.global = $("#sGlobal").value; toast("Saved."); S.screen = "settings"; render(); break;
    case "reset-global":
      S.settings.global = GP_DEFAULT; render(); toast("The template is restored. Select Save to keep it."); break;
    case "save-package": {
      const sel = document.querySelector('input[name="pstyle"]:checked');
      if (sel) S.settings.style = sel.value;
      toast("Saved."); S.screen = "settings"; render(); break;
    }
    case "chk-add": collectCheckEdits(); S.settings.checks.push({name:"new check", cmd:"", out:"(no output)"}); render(); break;
    case "chk-del": collectCheckEdits(); S.settings.checks.splice(Number(node.getAttribute("data-i")), 1); render(); break;
    case "save-checks": collectCheckEdits(); toast("Saved."); S.screen = "settings"; render(); break;

    case "modal-close": closeModal(); break;
  }
}

$(".win-m").addEventListener("click", e => {
  const n = e.target.closest("[data-act]"); if (!n) return;
  if (S.screen === "describe") saveRequestDraft();
  handleAction(n.getAttribute("data-act"), n);
});
$("#overlay").addEventListener("click", e => {
  const n = e.target.closest("[data-act]"); if (!n) return;
  handleAction(n.getAttribute("data-act"), n);
});
$("#overlay").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".dlpick .chip")) e.target.click();
});
$("#mBody").addEventListener("input", e => {
  if (e.target.id === "sLink"){
    const p = $("#linkPreview");
    if (p) p.textContent = e.target.value.replace(/\/+$/, "") + "/maintain-0143-plan.zip";
  }
});

/* ================= screen navigator ================= */
function seed(key){
  initState(true);
  const ref = () => { S.runRefs.push({name:"wind-spec-extract.pdf", size:"412 KB"}); };
  switch(key){
    case "home": break;
    case "describe": S.screen = "describe"; break;
    case "send-plan": ref(); evStart(); break;
    case "receive-plan": ref(); evStart(); S.ex.outAction = true; S.screen = "receive"; break;
    case "plancheck": ref(); evStart(); evPlanProposed(); break;
    case "send-build": ref(); evStart(); evPlanProposed(); evPlanApproved(); break;
    case "receive-build": ref(); evStart(); evPlanProposed(); evPlanApproved(); S.ex.outAction = true; S.screen = "receive"; break;
    case "review-findings": ref(); evStart(); evPlanProposed(); evPlanApproved(); evBuildApplied(); evReviewFound(); break;
    case "send-repair": ref(); evStart(); evPlanProposed(); evPlanApproved(); evBuildApplied(); evReviewFound();
      newExchange("repair"); S.screen = "send"; break;
    case "test": ref(); evStart(); evPlanProposed(); evPlanApproved(); evBuildApplied(); evReviewFound();
      evRepairApplied(); evReviewApproved(true); break;
    case "save": ref(); evStart(); evPlanProposed(); evPlanApproved(); evBuildApplied(); evReviewFound();
      evRepairApplied(); evReviewApproved(true); S.stage = 4; S.screen = "save"; break;
    case "done": ref(); evStart(); evPlanProposed(); evPlanApproved(); evBuildApplied(); evReviewFound();
      evRepairApplied(); evReviewApproved(true); closeRun("Saved", "branch maintain/0143-wind-filter"); S.screen = "done"; break;
    case "history": S.screen = "history"; break;
    case "run-live": ref(); evStart(); evPlanProposed(); evPlanApproved(); evBuildApplied(); evReviewFound();
      evRepairApplied(); evReviewApproved(true); S.viewRun = "live"; S.historyBack = "test"; S.screen = "run-detail"; break;
    case "run-saved": S.viewRun = "0141"; S.historyBack = "history"; S.screen = "run-detail"; break;
    default: S.screen = key; break;
  }
  render();
}
$("#navSel").addEventListener("change", e => { if (e.target.value) seed(e.target.value); });
$("#btnReset").addEventListener("click", () => { initState(false); $("#navSel").value = ""; render(); });

/* ================= boot ================= */
initState(false);
render();
}
function start(){
  try{ main(); }
  catch(err){
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:99;background:#7a1f16;color:#fff;" +
      "font:12px/1.5 system-ui,sans-serif;padding:10px 14px;border-radius:8px;max-width:420px";
    d.textContent = "The mockup script stopped: " + (err && err.message ? err.message : err);
    document.body.appendChild(d);
    throw err;
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
else start();
})();
</script>
