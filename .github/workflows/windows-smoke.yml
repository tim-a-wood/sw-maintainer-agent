name: Windows smoke

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install --disable-pip-version-check ".[browser,ui]" pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run active workflow tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global user.name "Maintain CI"
          git config --global user.email "ci@example.invalid"

          python -m pytest -q --deselect `
            "tests/test_cli_history.py::test_selectable_history_shows_details_and_back_does_not_resume"
          Write-Host "pytest exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          maintain --version
          Write-Host "maintain exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installer, update, launcher, and diagnostics
        shell: pwsh
        run: |
          # FR-V14: the install needs only Python. The reference is this
          # checkout's own branch, so the smoke test installs what is
          # being tested rather than the newest published release.
          $branch = & git rev-parse --abbrev-ref HEAD
          & python .\scripts\install_maintain.py `
            --reference "refs/heads/$branch" --repository (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw "The installer failed." }

          $installedLauncher = Join-Path $env:LOCALAPPDATA "Programs\Maintain\Maintain.cmd"
          & $installedLauncher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location .\launchers
          try {
            & .\maintain.cmd --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          $privatePython = Join-Path $env:LOCALAPPDATA `
            "Programs\Maintain\venv\Scripts\python.exe"
          [IO.File]::WriteAllBytes($privatePython, [byte[]]@())

          & python .\scripts\install_maintain.py `
            --reference "refs/heads/$branch" --repository (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw "Repairing the private environment failed." }

          & $installedLauncher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\scripts\collect-maintain-diagnostics.ps1 `
            -OutputPath (Join-Path $env:RUNNER_TEMP "maintain-diagnostics.zip")
          if (-not $?) { throw "Diagnostic collection failed." }

      - name: Parse-check every PowerShell script
        shell: pwsh
        run: |
          # A syntax fault in an installer reaches a person as a broken
          # install, and nothing else in this suite reads PowerShell.
          $bad = 0
          foreach ($file in (Get-ChildItem -Recurse -Filter *.ps1)) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad = 1
              Write-Host "FAIL $($file.FullName)"
              foreach ($e in $errors) { Write-Host "  $($e.Message)" }
            }
          }
          if ($bad -ne 0) { throw "A PowerShell script does not parse." }

      - name: Resolve the newest release the way a fresh install does
        shell: pwsh
        run: |
          # FR-U7 + FR-V14. The installer is Python now, so its resolver
          # is unit-tested everywhere. What only a real run shows is the
          # resolver against GitHub itself, on the default path a person
          # takes when no reference is pinned.
          python .\scripts\check_release_resolver.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the self-updater
        shell: pwsh
        run: |
          # FR-V12: the updater is Python now, so the unit tests cover
          # its logic on every platform. What only Windows can show is
          # the real thing: a detached copy upgrading the installed
          # environment in place. The release here is this checkout's
          # own branch.
          $branch = & git rev-parse --abbrev-ref HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\Maintain"
          $staged = Join-Path $env:RUNNER_TEMP "update_maintain.py"
          Copy-Item .\src\maintain\updater.py $staged

          & python $staged `
            --reference "refs/heads/$branch" `
            --install-root $installRoot `
            --repository (Get-Location).Path `
            --app-process-id 0 --no-relaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The update writes its record whatever happens.
          $updateLog = Join-Path $installRoot "update.log"
          if (-not (Test-Path -LiteralPath $updateLog)) {
            throw "The updater left no log at $updateLog."
          }
          Get-Content -LiteralPath $updateLog -Tail 20

          $installedLauncher = Join-Path $installRoot "Maintain.cmd"
          & $installedLauncher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect failure evidence
        if: failure()
        shell: pwsh
        run: |
          try {
            & .\scripts\collect-maintain-diagnostics.ps1 `
              -OutputPath (Join-Path $env:RUNNER_TEMP "maintain-diagnostics.zip")
          }
          catch {
            Write-Warning $_
          }

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/maintain-diagnostics.zip

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          & python .\scripts\install_maintain.py --uninstall
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed." }
