name: Windows smoke

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install --disable-pip-version-check ".[browser,ui]" pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run active workflow tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global user.name "Maintain CI"
          git config --global user.email "ci@example.invalid"

          python -m pytest -q --deselect `
            "tests/test_cli_history.py::test_selectable_history_shows_details_and_back_does_not_resume"
          Write-Host "pytest exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          maintain --version
          Write-Host "maintain exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise installer, update, launcher, and diagnostics
        shell: pwsh
        env:
          MAINTAIN_PACKAGE_SOURCE: ".[browser]"
        run: |
          & .\scripts\install-windows.ps1
          if (-not $?) { throw "The installer failed." }

          $installedLauncher = Join-Path $env:LOCALAPPDATA "Programs\Maintain\Maintain.cmd"
          & $installedLauncher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location .\launchers
          try {
            & .\maintain.cmd --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          $privatePython = Join-Path $env:LOCALAPPDATA `
            "Programs\Maintain\venv\Scripts\python.exe"
          [IO.File]::WriteAllBytes($privatePython, [byte[]]@())

          & .\scripts\install-windows.ps1
          if (-not $?) { throw "Repairing the private environment failed." }

          & $installedLauncher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\scripts\collect-maintain-diagnostics.ps1 `
            -OutputPath (Join-Path $env:RUNNER_TEMP "maintain-diagnostics.zip")
          if (-not $?) { throw "Diagnostic collection failed." }

      - name: Parse-check every PowerShell script
        shell: pwsh
        run: |
          # A syntax fault in an installer reaches a person as a broken
          # install, and nothing else in this suite reads PowerShell.
          $bad = 0
          foreach ($file in (Get-ChildItem -Recurse -Filter *.ps1)) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad = 1
              Write-Host "FAIL $($file.FullName)"
              foreach ($e in $errors) { Write-Host "  $($e.Message)" }
            }
          }
          if ($bad -ne 0) { throw "A PowerShell script does not parse." }

      - name: Resolve the newest release the way a fresh install does
        shell: pwsh
        run: |
          # FR-U7. The smoke install above pins MAINTAIN_PACKAGE_SOURCE,
          # so it never runs the default path a person actually takes.
          # This runs that path's resolver for real, against GitHub.
          $script = ".\scripts\install-windows.ps1"
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$null, [ref]$null)
          foreach ($name in @("Assert-NativeCommand", "Resolve-LatestReleaseTag",
                              "Resolve-RemoteCommit")) {
            $fn = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] `
                -and $node.Name -eq $name
            }, $true)
            if ($null -eq $fn) { throw "install-windows.ps1 has no $name." }
            Invoke-Expression $fn.Extent.Text
          }

          $url = "https://github.com/tim-a-wood/sw-maintainer-agent.git"
          $git = (Get-Command git.exe).Source
          $tag = Resolve-LatestReleaseTag -GitPath $git -Repository $url
          Write-Host "Resolved release: $tag"
          if ($tag -notmatch "^refs/tags/v\d+(\.\d+)*$") {
            throw "The resolver returned '$tag', which is not a release tag."
          }
          $commit = Resolve-RemoteCommit -GitPath $git -Repository $url -Reference $tag
          Write-Host "Resolved commit: $commit"
          if ($commit -notmatch "^[0-9a-f]{40}$") {
            throw "The resolver returned '$commit', which is not a commit."
          }

      - name: Exercise the self-updater
        shell: pwsh
        run: |
          # The updater downloads a reference and runs that source's
          # installer. Here both come from this checkout: the local
          # path is the repository and the branch is the release.
          $env:MAINTAIN_PACKAGE_SOURCE = "$((Get-Location).Path)[browser]"
          $branch = & git rev-parse --abbrev-ref HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\src\maintain\data\windows\update-maintain.ps1 `
            -AppProcessId 0 -NoRelaunch `
            -Repository (Get-Location).Path `
            -Reference "refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installedLauncher = Join-Path $env:LOCALAPPDATA "Programs\Maintain\Maintain.cmd"
          & $installedLauncher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect failure evidence
        if: failure()
        shell: pwsh
        run: |
          try {
            & .\scripts\collect-maintain-diagnostics.ps1 `
              -OutputPath (Join-Path $env:RUNNER_TEMP "maintain-diagnostics.zip")
          }
          catch {
            Write-Warning $_
          }

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/maintain-diagnostics.zip

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          & .\scripts\uninstall-windows.ps1
          if (-not $?) { throw "Uninstall failed." }
